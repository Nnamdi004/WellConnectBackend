services:
  db:
    image: postgres:15-alpine
    container_name: wellconnect-db
    environment:
      POSTGRES_DB: wellconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: anyika
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wellconnect-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: wellconnect-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/wellconnect
      - DB_USERNAME=postgres
      - DB_PASSWORD=anyika
      - JWT_SECRET=7a825020606afc3bbb8520a13194b353173f45e4e8afce3f466527f0e671d64347e4b5476c7d4b31bded3955c9b0873f5895f0f85fce47834f851c28255f1465
      - JWT_EXPIRATION=86400000
      - ENCRYPTION_KEY=1234567890123456
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
      - REDIS_HOST=redis-10217.c341.af-south-1-1.ec2.cloud.redislabs.com
      - REDIS_PORT=10217
      - REDIS_PASSWORD=eYtl7sOlNejysooNNblR9JY6Q70ReRyg
      - ADMIN_NAME=Administrator
      - ADMIN_EMAIL=admin@wellconnect.com
      - ADMIN_PASSWORD=wellconnect2025team
    depends_on:
      - db
    networks:
      - wellconnect-network

  # Remove local Redis since we're using remote Redis
  # redis:
  #   image: redis:7-alpine
  #   container_name: wellconnect-redis
  #   ports:
  #     - "6379:6379"

volumes:
  postgres_data:

networks:
  wellconnect-network:
    driver: bridge
