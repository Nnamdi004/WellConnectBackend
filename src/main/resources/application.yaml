server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: Wellconnect
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wellconnect}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:anyika}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      mode: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-must-be-at-least-32-characters}
  expiration: ${JWT_EXPIRATION:86400000}

encryption:
  key: ${ENCRYPTION_KEY:1234567890123456}

admin:
  email: ${ADMIN_EMAIL:admin@wellconnect.com}
  password: ${ADMIN_PASSWORD:admin123}
